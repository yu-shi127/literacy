<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sample</title>
    <style>
      #container {
        background: #ccc;
        border: solid 1px #555;
        padding: 20px;
        width: 90%     
      }
      #box {
        background: #ffbcbc;
        border-style: none;
        border-color: #999;
        /* 省略 */
        border-width: 0px;
        border-radius: 45px;
        padding: 40px;
        width: 140px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="box">The quick brown fox jumps over the lazy dog</div>
    </div>
  </body>
</html>
